name: Update pinned projects

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 1 * *"

permissions:
  contents: write

jobs:
  update-pinned-projects:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch pinned GitHub repositories
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PINNED_PROJECTS_TOKEN || github.token }}
          script: |
            const fs = require('fs');

            const username = 'mdickson05';
            const query = `
              query($login: String!) {
                user(login: $login) {
                  pinnedItems(first: 6, types: REPOSITORY) {
                    nodes {
                      ... on Repository {
                        name
                        nameWithOwner
                        description
                        url
                        homepageUrl
                        forkCount
                        stargazerCount
                        createdAt
                        updatedAt
                        pushedAt
                        isArchived
                        isFork
                        primaryLanguage {
                          name
                          color
                        }
                        languages(first: 5, orderBy: { field: SIZE, direction: DESC }) {
                          edges {
                            size
                            node {
                              name
                              color
                            }
                          }
                        }
                        repositoryTopics(first: 6) {
                          nodes {
                            topic {
                              name
                            }
                          }
                        }
                        issues(first: 1, states: OPEN) {
                          totalCount
                        }
                        pullRequests(first: 1, states: OPEN) {
                          totalCount
                        }
                      }
                    }
                  }
                }
              }
            `;

            const result = await github.graphql(query, { login: username });
            const projects = result.user.pinnedItems.nodes.map((repo) => ({
              name: repo.name,
              nameWithOwner: repo.nameWithOwner,
              description: repo.description,
              url: repo.url,
              homepageUrl: repo.homepageUrl || null,
              primaryLanguage: repo.primaryLanguage
                ? {
                    name: repo.primaryLanguage.name,
                    color: repo.primaryLanguage.color
                  }
                : null,
              languages: repo.languages.edges.map((edge) => ({
                name: edge.node.name,
                color: edge.node.color,
                size: edge.size
              })),
              topics: repo.repositoryTopics.nodes.map((node) => node.topic.name),
              stats: {
                stars: repo.stargazerCount,
                forks: repo.forkCount,
                openIssues: repo.issues.totalCount,
                openPullRequests: repo.pullRequests.totalCount
              },
              dates: {
                createdAt: repo.createdAt,
                updatedAt: repo.updatedAt,
                pushedAt: repo.pushedAt
              },
              flags: {
                isArchived: repo.isArchived,
                isFork: repo.isFork
              }
            }));

            fs.mkdirSync('assets/data', { recursive: true });
            fs.writeFileSync(
              'assets/data/pinned-projects.json',
              `${JSON.stringify(projects, null, 2)}\n`
            );

      - name: Commit pinned project data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "CHORE: Update pinned project data"
          file_pattern: assets/data/pinned-projects.json
